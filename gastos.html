<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Jorge</title>
    <style>
        [hidden] { display: none !important; }

        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; text-align: center; margin: 0; }
        .contenedor-gastos { max-width: 1100px; margin: auto; text-align: left; padding-top: 20px; }
        h1 { color: #fff; font-size: 1.8rem; margin-bottom: 20px; }

        /* Selector de mes */
        .selector-mes { margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        select { background: #1e1e1e; color: white; padding: 10px; border-radius: 8px; border: 1px solid #333; font-size: 1rem; cursor: pointer; }

        .boton-registro {
            display: block; width: 100%; padding: 18px; background-color: #378049;
            color: #fff; text-align: center; border-radius: 12px; font-weight: bold;
            text-decoration: none; margin-bottom: 30px; transition: 0.3s; box-sizing: border-box;
        }
        .boton-registro:hover { background-color: #fff; color: #000; transform: translateY(-3px); }
        .boton-registro:focus-visible, .boton-volver:focus-visible, select:focus-visible { outline: 3px solid #03dac6; outline-offset: 3px; }

        .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .tarjeta { background: #1e1e1e; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .tarjeta h3 { margin: 0; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .tarjeta p { font-size: 1.6rem; margin: 15px 0 0 0; font-weight: bold; color: #ff4444; }
        .tarjeta p.saldo { color: #fff; }
        .tarjeta p.ingreso { color: #4caf50; }

        /* Tarjeta de balance con gráfico desplegable */
        .tarjeta-balance { cursor: pointer; transition: border-color 0.2s; }
        .tarjeta-balance:hover { border-color: #555; }
        .btn-grafico {
            margin-top: 14px; background: transparent; color: #bb86fc;
            border: 1px solid #333; border-radius: 10px;
            padding: 6px 12px; font-size: 0.75rem; font-family: inherit; cursor: pointer;
            transition: 0.2s;
        }
        .btn-grafico:hover { border-color: #bb86fc; color: #fff; }
        .btn-grafico:focus-visible { outline: 3px solid #03dac6; outline-offset: 3px; }

        .panel-grafico { background: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 40px; }
        .panel-grafico h2 { margin: 0 0 4px 0; font-size: 1.1rem; font-weight: 600; }
        .panel-grafico .subtitulo { margin: 0 0 16px 0; color: #888; font-size: 0.8rem; }
        .grafico-scroll { overflow-x: auto; }
        .grafico-scroll svg { display: block; width: 100%; min-width: 560px; height: auto; }
        #grafico-resumen { margin: 16px 0 0 0; font-size: 0.85rem; color: #bbb; line-height: 1.6; }
        #grafico-estado { margin: 8px 0 0 0; font-size: 0.8rem; color: #888; }

        .boton-volver { display: inline-block; margin-top: 40px; color: #888; text-decoration: none; font-size: 0.9rem; }
        .boton-volver:hover { color: white; text-decoration: underline; }
        #mensaje-estado { color: #888; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="contenedor-gastos">
        <h1>📊 Control de Gastos</h1>

        <div class="selector-mes">
            <label for="mes-select">Selecciona el mes:</label>
            <select id="mes-select" onchange="actualizarDatos()">
                <option value="Mes Actual" selected>Mes Actual</option>
                <option value="Enero">Enero</option>
                <option value="Febrero">Febrero</option>
                <option value="Marzo">Marzo</option>
                <option value="Abril">Abril</option>
                <option value="Mayo">Mayo</option>
                <option value="Junio">Junio</option>
                <option value="Julio">Julio</option>
                <option value="Agosto">Agosto</option>
                <option value="Septiembre">Septiembre</option>
                <option value="Octubre">Octubre</option>
                <option value="Noviembre">Noviembre</option>
                <option value="Diciembre">Diciembre</option>
                <option value="Balance anual">Balance anual</option>
            </select>
        </div>

        <a href="https://docs.google.com/spreadsheets/d/1KZ1tqMvFPWKgGg0sheADgu7-MU2GD9gDd2BYTW8n2Bw/edit" target="_blank" rel="noopener noreferrer" class="boton-registro">📝 EDITAR EN GOOGLE SHEETS</a>

        <div class="resumen">
            <div class="tarjeta"><h3>Ingresos</h3><p id="ingresos-mes" class="ingreso">0,00 €</p></div>
            <div class="tarjeta"><h3>Gastos</h3><p id="gasto-actual">0,00 €</p></div>
            <div class="tarjeta tarjeta-balance" id="tarjeta-balance">
                <h3>Balance</h3>
                <p id="balance-mes">0,00 €</p>
                <button type="button" id="btn-grafico" class="btn-grafico" aria-expanded="false" aria-controls="panel-grafico">Ver evolución ▾</button>
            </div>
            <div class="tarjeta"><h3>Saldo Real</h3><p id="saldo-real" class="saldo">0,00 €</p></div>
        </div>

        <section id="panel-grafico" class="panel-grafico" hidden>
            <h2>Balance mes a mes</h2>
            <p class="subtitulo">Balance de cada mes del año</p>
            <div class="grafico-scroll" id="grafico-contenido"></div>
            <p id="grafico-resumen"></p>
            <p id="grafico-estado" aria-live="polite"></p>
        </section>

        <p id="mensaje-estado">Selecciona un mes para cargar datos...</p>

        <a href="index.html" class="boton-volver">← Volver al Portal Principal</a>
    </div>

    <script>
        const spreadsheetId = "1KZ1tqMvFPWKgGg0sheADgu7-MU2GD9gDd2BYTW8n2Bw";

        // Celdas de la hoja de las que sale cada dato (igual en todas las pestañas).
        // Si algún día cambias de sitio una cifra en Google Sheets, solo hay que tocar esto.
        const CELDAS = { ingresos: "G3", gastos: "G2", balance: "G6", saldo: "H2" };

        // Pestañas de los meses (deben llamarse exactamente así en Google Sheets).
        const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const MESES_CORTOS = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        let ultimaPeticion = 0;      // evita que una respuesta lenta pise a una más reciente
        let evolucionHora = 0;       // cuándo se cargó el gráfico por última vez
        let cargandoEvolucion = false;

        /* ===== LÓGICA ===== */
        // useGrouping: 'always' fuerza el punto de miles también en cifras de 4 dígitos (4.211,83 €)
        const moneda = (n) => n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', useGrouping: 'always' });

        // Cifra sin decimales para las etiquetas del gráfico (-892, 1.234...)
        const compacto = (n) => Math.round(n).toLocaleString('es-ES', { maximumFractionDigits: 0, useGrouping: 'always' });

        // Lee una celda por su referencia de Sheets (p. ej. "G3").
        // Con headers=1 la fila 1 de la hoja es la cabecera, así que la fila 2 es filas[0].
        function leerCelda(filas, ref) {
            const m = ref.match(/^([A-Z])(\d+)$/);
            if (!m) return 0;
            const col = m[1].charCodeAt(0) - 65;
            const fila = parseInt(m[2], 10) - 2;
            const celda = filas[fila] && filas[fila].c && filas[fila].c[col];
            if (!celda || celda.v === null || celda.v === undefined) return 0;
            if (typeof celda.v === 'number') return celda.v;
            // Si llegara como texto ("1.234,56 €"): quitar puntos de millar y pasar la coma a punto decimal
            const limpio = celda.v.toString().replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
            return parseFloat(limpio) || 0;
        }

        // Dibuja el gráfico de barras (SVG). datos = [{ mes, corto, balance, hayDatos }, ...]
        function construirGrafico(datos) {
            const W = 720, H = 300, izq = 10, der = 10, arriba = 34, abajo = 50;
            const alto = H - arriba - abajo;
            const ancho = W - izq - der;
            const conDatos = datos.filter(d => d.hayDatos);
            const max = Math.max(0, ...conDatos.map(d => d.balance));
            const min = Math.min(0, ...conDatos.map(d => d.balance));
            const rango = (max - min) || 1;
            const yCero = arriba + (max / rango) * alto;
            const col = ancho / datos.length;
            const barra = Math.min(40, col * 0.6);

            const partes = [];
            partes.push(`<line x1="${izq}" x2="${W - der}" y1="${yCero}" y2="${yCero}" stroke="#444" stroke-width="1"/>`);

            datos.forEach((d, i) => {
                const cx = izq + col * i + col / 2;
                partes.push(`<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="12" fill="${d.hayDatos ? '#aaa' : '#555'}">${d.corto}</text>`);
                if (!d.hayDatos) return;

                const h = Math.max(Math.abs(d.balance) / rango * alto, 2);
                const positivo = d.balance >= 0;
                const y = positivo ? yCero - h : yCero;
                const color = positivo ? '#4caf50' : '#ff5c5c';
                const yEtiqueta = positivo ? y - 6 : y + h + 14;

                partes.push(`<g><title>${d.mes}: ${moneda(d.balance)}</title><rect x="${cx - barra / 2}" y="${y}" width="${barra}" height="${h}" rx="4" fill="${color}"/></g>`);
                partes.push(`<text x="${cx}" y="${yEtiqueta}" text-anchor="middle" font-size="11" fill="#e0e0e0">${compacto(d.balance)}</text>`);
            });

            return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras con el balance de cada mes del año">${partes.join('')}</svg>`;
        }

        // Mejor mes, peor mes y suma de todos los meses con datos.
        function resumenGrafico(datos) {
            const con = datos.filter(d => d.hayDatos);
            if (!con.length) return null;
            const mejor = con.reduce((a, b) => (b.balance > a.balance ? b : a));
            const peor = con.reduce((a, b) => (b.balance < a.balance ? b : a));
            const total = con.reduce((suma, d) => suma + d.balance, 0);
            return { mejor, peor, total };
        }
        /* ===== FIN LÓGICA ===== */

        // Descarga una pestaña de la hoja y devuelve sus filas.
        async function leerHoja(nombre) {
            const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(nombre)}&t=${Date.now()}`;
            const respuesta = await fetch(url);
            if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);

            const texto = await respuesta.text();
            const json = JSON.parse(texto.substring(texto.indexOf('{'), texto.lastIndexOf('}') + 1));
            if (json.status === 'error') throw new Error('Error de Google Sheets');
            return json.table.rows;
        }

        async function actualizarDatos() {
            const mes = document.getElementById('mes-select').value;
            const estado = document.getElementById('mensaje-estado');
            const id = ++ultimaPeticion;

            estado.innerText = `Cargando datos de ${mes}...`;
            estado.style.color = "#888";

            try {
                // Las pestañas de Google Sheets deben llamarse exactamente igual que las opciones del selector.
                const filas = await leerHoja(mes);
                if (id !== ultimaPeticion) return; // ya se pidió otro mes después

                const ingresos = leerCelda(filas, CELDAS.ingresos);
                const gastos = leerCelda(filas, CELDAS.gastos);
                const balance = leerCelda(filas, CELDAS.balance);
                const saldo = leerCelda(filas, CELDAS.saldo);

                document.getElementById('ingresos-mes').innerText = moneda(ingresos);
                document.getElementById('gasto-actual').innerText = moneda(gastos);

                const elBalance = document.getElementById('balance-mes');
                elBalance.innerText = moneda(balance);
                elBalance.style.color = balance < 0 ? "#ff5c5c" : "#19cf58";

                document.getElementById('saldo-real').innerText = moneda(saldo);
                estado.innerText = `✅ Datos de ${mes} cargados`;
                estado.style.color = "#03dac6";
            } catch (e) {
                if (id !== ultimaPeticion) return;
                console.error('Gastos:', e);
                estado.innerText = "⚠️ No se pudieron cargar los datos. Comprueba que la hoja está compartida por enlace y que la pestaña existe.";
                estado.style.color = "#ff4444";
            }
        }

        /* ===== GRÁFICO DE EVOLUCIÓN ===== */
        // Lee la pestaña de cada mes (las 12 a la vez) y dibuja el gráfico.
        async function cargarEvolucion() {
            if (cargandoEvolucion) return;
            cargandoEvolucion = true;

            const contenido = document.getElementById('grafico-contenido');
            const resumen = document.getElementById('grafico-resumen');
            const estado = document.getElementById('grafico-estado');
            estado.innerText = "Cargando los 12 meses...";
            estado.style.color = "#888";

            const resultados = await Promise.allSettled(MESES.map(m => leerHoja(m)));
            const datos = resultados.map((r, i) => {
                const base = { mes: MESES[i], corto: MESES_CORTOS[i], balance: 0, hayDatos: false, error: false };
                if (r.status !== 'fulfilled') return { ...base, error: true };
                const ingresos = leerCelda(r.value, CELDAS.ingresos);
                const gastos = leerCelda(r.value, CELDAS.gastos);
                const balance = leerCelda(r.value, CELDAS.balance);
                // Un mes sin ingresos, gastos ni balance se considera "sin datos" y no se dibuja.
                return { ...base, balance, hayDatos: ingresos !== 0 || gastos !== 0 || balance !== 0 };
            });

            const fallidos = datos.filter(d => d.error).map(d => d.mes);
            const r = resumenGrafico(datos);

            if (!r) {
                contenido.innerHTML = "";
                resumen.innerText = "";
                estado.innerText = fallidos.length
                    ? "⚠️ No se pudieron leer los meses. Comprueba que la hoja está compartida por enlace."
                    : "Todavía no hay datos en ningún mes.";
                estado.style.color = fallidos.length ? "#ff4444" : "#888";
            } else {
                contenido.innerHTML = construirGrafico(datos);
                resumen.innerText = `Mejor mes: ${r.mejor.mes} (${moneda(r.mejor.balance)}) · Peor mes: ${r.peor.mes} (${moneda(r.peor.balance)}) · Suma de los meses: ${moneda(r.total)}`;
                estado.innerText = fallidos.length ? `⚠️ No se pudieron leer: ${fallidos.join(', ')}.` : "";
                estado.style.color = "#ff4444";
                evolucionHora = Date.now();
            }
            cargandoEvolucion = false;
        }

        // Pulsar la tarjeta de Balance abre o cierra el gráfico
        document.getElementById('tarjeta-balance').addEventListener('click', () => {
            const panel = document.getElementById('panel-grafico');
            const btn = document.getElementById('btn-grafico');
            const abrir = panel.hidden;
            panel.hidden = !abrir;
            btn.setAttribute('aria-expanded', String(abrir));
            btn.textContent = abrir ? 'Ocultar evolución ▴' : 'Ver evolución ▾';
            // Se vuelve a leer la hoja si es la primera vez o si han pasado más de 5 minutos
            if (abrir && Date.now() - evolucionHora > 5 * 60 * 1000) cargarEvolucion();
        });

        // Cargar al iniciar
        actualizarDatos();
    </script>
</body>
</html>
