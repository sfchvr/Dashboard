<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal Financiero - Jorge</title>
    <style>
        [hidden] { display: none !important; }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        /* Widget LaLiga */
        .widget-liga {
            position: absolute; top: 30px; right: 30px;
            background: #1e1e1e; border: 1px solid #333;
            padding: 20px; border-radius: 20px;
            text-align: center; width: 260px; box-sizing: border-box;
            transition: width 0.25s ease, max-width 0.25s ease;
        }
        .widget-liga.abierto { width: 360px; }
        .widget-liga span.cabecera { font-size: 0.7rem; color: #bb86fc; text-transform: uppercase; letter-spacing: 1px; }
        .widget-liga p { margin: 8px 0 0 0; }
        #partido-jornada { font-size: 0.65rem; color: #bb86fc; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-top: 4px; }
        #partido-rival { font-weight: 600; font-size: 1rem; }
        #partido-info { font-size: 0.75rem; opacity: 0.7; text-transform: capitalize; }
        #partido-cuenta { font-size: 0.85rem; font-weight: 600; color: #03dac6; }
        #partido-cuenta.en-juego { color: #ff5c5c; }
        #partido-aviso { font-size: 0.65rem; opacity: 0.5; }

        /* Botón y panel de resultados */
        .btn-resultados {
            margin-top: 14px; background: transparent; color: #bb86fc;
            border: 1px solid #333; border-radius: 10px;
            padding: 6px 12px; font-size: 0.75rem; font-family: inherit; cursor: pointer;
            transition: 0.2s;
        }
        .btn-resultados:hover { border-color: #bb86fc; color: #fff; }
        .btn-resultados:focus-visible { outline: 3px solid #03dac6; outline-offset: 3px; }

        #resumen-resultados { font-size: 0.7rem; opacity: 0.7; margin-top: 14px; }
        #lista-resultados {
            list-style: none; margin: 8px 0 0 0; padding: 0 14px 0 0; scrollbar-width: thin; scrollbar-color: #444 transparent;
            max-height: 50vh; overflow-y: auto; text-align: left;
        }
        #lista-resultados li {
            display: grid; grid-template-columns: 10px 1fr auto; column-gap: 8px; align-items: baseline;
            padding: 8px 0; border-top: 1px solid #2c2c2c; font-size: 0.8rem;
        }
        .res-marcador { font-weight: 700; font-variant-numeric: tabular-nums; }
        .res-meta { grid-column: 2 / 4; font-size: 0.65rem; opacity: 0.55; }
        .punto { width: 8px; height: 8px; border-radius: 50%; background: #666; align-self: center; }
        .punto.v { background: #4caf50; }
        .punto.e { background: #ffb300; }
        .punto.d { background: #ff5c5c; }

        /* Reloj y Fecha */
        #reloj-contenedor { text-align: center; margin-bottom: 40px; }
        #reloj { font-size: 4.5rem; font-weight: 200; color: #03dac6; margin: 0; font-variant-numeric: tabular-nums; }
        #fecha { font-size: 1.1rem; color: #888; margin-bottom: 5px; text-transform: capitalize; }

        /* Botón Único de Gastos */
        .boton-gastos {
            background-color: #2e55d9;
            color: #fff;
            padding: 25px 60px;
            border-radius: 20px;
            font-size: 1.5rem;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(46, 85, 217, 0.3);
        }
        .boton-gastos:hover { transform: scale(1.05); background-color: #03dac6; color: #000; }
        .boton-gastos:focus-visible, .link-rapido:focus-visible { outline: 3px solid #03dac6; outline-offset: 4px; }

        /* Accesos rápidos minimalistas */
        .accesos-rapidos { margin-top: 60px; display: flex; gap: 40px; }
        .link-rapido { color: #777; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .link-rapido:hover { color: #fff; }

        /* Pantallas medianas y pequeñas: el widget pasa a ir en el flujo normal para no solaparse con el reloj */
        @media (max-width: 1100px) {
            .widget-liga { position: static; margin-bottom: 30px; width: 100%; max-width: 260px; }
            .widget-liga.abierto { width: 100%; max-width: 360px; }
        }
        @media (max-width: 700px) {
            #reloj { font-size: 3.2rem; }
            .boton-gastos { padding: 20px 36px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="widget-liga" id="widget-liga">
        <span class="cabecera">LaLiga 26/27</span>
        <p id="partido-jornada" hidden></p>
        <p id="partido-rival">Cargando...</p>
        <p id="partido-info"></p>
        <p id="partido-cuenta"></p>
        <p id="partido-aviso"></p>

        <button type="button" id="btn-resultados" class="btn-resultados" aria-expanded="false" aria-controls="panel-resultados" hidden>Ver resultados ▾</button>
        <div id="panel-resultados" hidden>
            <p id="resumen-resultados"></p>
            <ul id="lista-resultados"></ul>
        </div>
    </div>

    <div id="reloj-contenedor">
        <p id="fecha">-- / -- / ----</p>
        <p id="reloj">00:00:00</p>
    </div>

    <a href="gastos.html" class="boton-gastos">
        <span>📊</span> ACCEDER A GASTOS
    </a>

    <div class="accesos-rapidos">
        <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer" class="link-rapido"><span>✉️</span> Correo</a>
        <a href="https://www.google.es/maps" target="_blank" rel="noopener noreferrer" class="link-rapido"><span>📍</span> Maps</a>
    </div>

    <script>
        /* ===== RELOJ ===== */
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        /* ===== WIDGET LALIGA: LÓGICA ===== */
        // Año en el que empieza la temporada: de agosto a diciembre cuenta como ese año, de enero a julio como el siguiente.
        const INICIO_TEMPORADA = 2026;
        // Durante este tiempo desde el inicio, el partido se considera "en juego"; pasado ese tiempo, se salta solo.
        const DURACION_PARTIDO = 2 * 60 * 60 * 1000; // 2 horas
        // Palabra que identifica a tu equipo dentro del nombre del partido (para colorear victoria / empate / derrota).
        const MI_EQUIPO = 'sevilla';

        const MESES = { enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6,
                        agosto: 7, septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11 };
        const NOMBRES_RESULTADO = { v: 'Victoria', e: 'Empate', d: 'Derrota' };

        // Convierte "jueves, 29 de octubre, 21:00" en una fecha real. Devuelve null si no entiende el texto.
        function parseFecha(info) {
            const m = (info || '').toLowerCase().match(/(\d{1,2})\s+de\s+([a-záéíóú]+)\D+(\d{1,2}):(\d{2})/);
            if (!m) return null;
            const mes = MESES[m[2]];
            if (mes === undefined) return null;
            const anio = mes >= 7 ? INICIO_TEMPORADA : INICIO_TEMPORADA + 1;
            const fecha = new Date(anio, mes, parseInt(m[1], 10), parseInt(m[3], 10), parseInt(m[4], 10));
            return fecha.getMonth() === mes ? fecha : null;
        }

        function construirPartidos(filas) {
            return filas.map(f => ({
                partido: f.partido,
                info: f.info,
                resultado: (f.resultado || '').trim(),
                jornada: (f.jornada || '').trim(),
                fecha: parseFecha(f.info)
            }));
        }

        // Elige el primer partido sin resultado que aún no ha terminado, aunque en la hoja haya partidos ya jugados.
        function proximoPartido(partidos, ahora) {
            const conFecha = partidos.filter(p => p.fecha);
            if (!conFecha.length) return partidos.find(p => !p.resultado) || null;
            return conFecha
                .filter(p => !p.resultado && ahora.getTime() < p.fecha.getTime() + DURACION_PARTIDO)
                .sort((a, b) => a.fecha - b.fecha)[0] || null;
        }

        // Partidos con resultado, del más reciente al más antiguo.
        function partidosJugados(partidos) {
            return partidos
                .filter(p => p.resultado)
                .sort((a, b) => (b.fecha ? b.fecha.getTime() : 0) - (a.fecha ? a.fecha.getTime() : 0));
        }

        // Texto de la cuenta atrás.
        function cuentaAtras(fecha, ahora) {
            const diff = fecha.getTime() - ahora.getTime();
            if (diff <= 0) return { texto: "¡En juego!", enJuego: true };

            const inicioDia = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const dias = Math.round((inicioDia(fecha) - inicioDia(ahora)) / 86400000);

            if (dias === 0) {
                const minTotal = Math.floor(diff / 60000);
                const h = Math.floor(minTotal / 60);
                const min = minTotal % 60;
                return { texto: h > 0 ? `Hoy · faltan ${h} h ${min} min` : `Hoy · faltan ${min} min`, enJuego: false };
            }
            if (dias === 1) return { texto: "Mañana", enJuego: false };
            return { texto: `Faltan ${dias} días`, enJuego: false };
        }

        // "10" -> "Jornada 10"; cualquier otro texto (p. ej. "Copa del Rey") se deja tal cual.
        function etiquetaJornada(j) {
            if (!j) return '';
            return /^\d+$/.test(j) ? `Jornada ${j}` : j;
        }

        // Devuelve 'v' (victoria), 'e' (empate), 'd' (derrota) o null si no se puede saber.
        function resultadoEquipo(partido, resultado) {
            const equipos = (partido || '').split(/\s+vs\s+/i);
            const r = (resultado || '').match(/^\s*(\d+)\s*[-–:]\s*(\d+)\s*$/);
            if (equipos.length !== 2 || !r) return null;
            const local = equipos[0].toLowerCase().includes(MI_EQUIPO);
            const visitante = equipos[1].toLowerCase().includes(MI_EQUIPO);
            if (local === visitante) return null;
            const golesMios = parseInt(local ? r[1] : r[2], 10);
            const golesRival = parseInt(local ? r[2] : r[1], 10);
            return golesMios > golesRival ? 'v' : golesMios < golesRival ? 'd' : 'e';
        }

        function resumenResultados(jugados) {
            const c = { v: 0, e: 0, d: 0 };
            jugados.forEach(p => { const r = resultadoEquipo(p.partido, p.resultado); if (r) c[r]++; });
            return `${c.v} V · ${c.e} E · ${c.d} D`;
        }
        /* ===== FIN LÓGICA ===== */

        /* ===== WIDGET LALIGA: PANTALLA Y DATOS ===== */
        const CLAVE_CACHE = 'liga-partidos';
        let partidos = [];

        function guardarCache(filas) {
            try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(filas)); } catch (e) {}
        }
        function leerCache() {
            try { return JSON.parse(localStorage.getItem(CLAVE_CACHE)) || []; } catch (e) { return []; }
        }

        // Próximo partido + cuenta atrás (se repite cada 30 segundos)
        function pintar() {
            if (!partidos.length) return;
            const ahora = new Date();
            const p = proximoPartido(partidos, ahora);
            const jornadaEl = document.getElementById('partido-jornada');
            const rivalEl = document.getElementById('partido-rival');
            const infoEl = document.getElementById('partido-info');
            const cuentaEl = document.getElementById('partido-cuenta');

            if (!p) {
                jornadaEl.hidden = true;
                rivalEl.innerText = "Sin más partidos";
                infoEl.innerText = "";
                cuentaEl.innerText = "";
                return;
            }
            const etiqueta = etiquetaJornada(p.jornada);
            jornadaEl.innerText = etiqueta;
            jornadaEl.hidden = !etiqueta;
            rivalEl.innerText = p.partido;
            infoEl.innerText = p.info;
            if (p.fecha) {
                const c = cuentaAtras(p.fecha, ahora);
                cuentaEl.innerText = c.texto;
                cuentaEl.classList.toggle('en-juego', c.enJuego);
            } else {
                cuentaEl.innerText = "";
            }
        }

        // Lista desplegable de resultados (solo se rehace cuando llegan datos nuevos)
        function pintarResultados() {
            const jugados = partidosJugados(partidos);
            const widget = document.getElementById('widget-liga');
            const btn = document.getElementById('btn-resultados');
            const panel = document.getElementById('panel-resultados');
            const lista = document.getElementById('lista-resultados');

            btn.hidden = !jugados.length;
            if (!jugados.length) {
                panel.hidden = true;
                widget.classList.remove('abierto');
                return;
            }

            document.getElementById('resumen-resultados').innerText = resumenResultados(jugados);

            const items = jugados.map(p => {
                const r = resultadoEquipo(p.partido, p.resultado);

                const punto = document.createElement('span');
                punto.className = 'punto' + (r ? ' ' + r : '');
                if (r) {
                    punto.setAttribute('role', 'img');
                    punto.setAttribute('aria-label', NOMBRES_RESULTADO[r]);
                    punto.title = NOMBRES_RESULTADO[r];
                }

                const nombre = document.createElement('span');
                nombre.textContent = p.partido;

                const marcador = document.createElement('span');
                marcador.className = 'res-marcador';
                marcador.textContent = p.resultado;

                const meta = document.createElement('span');
                meta.className = 'res-meta';
                const partes = [];
                const etiqueta = etiquetaJornada(p.jornada);
                if (etiqueta) partes.push(etiqueta);
                if (p.fecha) partes.push(p.fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }));
                meta.textContent = partes.join(' · ');

                const li = document.createElement('li');
                li.append(punto, nombre, marcador, meta);
                return li;
            });
            lista.replaceChildren(...items);
        }

        // Abrir / cerrar el desplegable
        document.getElementById('btn-resultados').addEventListener('click', () => {
            const panel = document.getElementById('panel-resultados');
            const btn = document.getElementById('btn-resultados');
            const abrir = panel.hidden;
            panel.hidden = !abrir;
            document.getElementById('widget-liga').classList.toggle('abierto', abrir);
            btn.setAttribute('aria-expanded', String(abrir));
            btn.textContent = abrir ? 'Ocultar resultados ▴' : 'Ver resultados ▾';
        });

        async function cargarPartidos() {
            const gidLiga = "431024044";
            const spreadsheetId = "1KZ1tqMvFPWKgGg0sheADgu7-MU2GD9gDd2BYTW8n2Bw";
            // headers=1: la fila 1 de la pestaña ("Partidos" / "Info" / "Resultado" / "Jornada") es la cabecera.
            const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&headers=1&gid=${gidLiga}&t=${Date.now()}`;

            const avisoEl = document.getElementById('partido-aviso');
            const valor = (fila, i) => {
                const c = fila.c && fila.c[i];
                return c ? String(c.f || c.v || "").trim() : "";
            };

            try {
                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);

                const texto = await respuesta.text();
                const json = JSON.parse(texto.substring(texto.indexOf('{'), texto.lastIndexOf('}') + 1));
                if (json.status === 'error') throw new Error('Error de Google Sheets');

                // Columnas: A = Partidos, B = Info, C = Resultado, D = Jornada
                const filas = json.table.rows
                    .map(r => ({ partido: valor(r, 0), info: valor(r, 1), resultado: valor(r, 2), jornada: valor(r, 3) }))
                    .filter(f => f.partido);

                guardarCache(filas);
                partidos = construirPartidos(filas);
                avisoEl.innerText = "";
            } catch (e) {
                console.error('Widget LaLiga:', e);
                const cache = leerCache();
                if (cache.length) {
                    partidos = construirPartidos(cache);
                    avisoEl.innerText = "Datos guardados (sin conexión)";
                } else {
                    document.getElementById('partido-rival').innerText = "No se pudo cargar";
                    document.getElementById('partido-info').innerText = "Revisa que la hoja esté compartida como lectura por enlace";
                    return;
                }
            }
            pintar();
            pintarResultados();
        }

        cargarPartidos();
        setInterval(cargarPartidos, 5 * 60 * 1000); // vuelve a leer la hoja cada 5 minutos
        setInterval(pintar, 30 * 1000);             // actualiza la cuenta atrás cada 30 segundos
    </script>
</body>
</html>
